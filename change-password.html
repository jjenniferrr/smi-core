<!DOCTYPE html>
<html lang="es">
<head>
    <!--
        ============================================================================
        ARCHIVO: change-password.html
        DESCRIPCION GENERAL
        ============================================================================

        Este archivo implementa la pantalla destinada al cambio de contrasena
        personal de las cuentas internas del sistema S.M.I. CORE.

        La vista permite que el usuario autenticado modifique exclusivamente su
        propia clave de acceso. El formulario solicita la contrasena actual, una
        nueva contrasena y la confirmacion de esta ultima antes de enviar la
        informacion al backend.

        Esta pantalla tambien se utiliza cuando una cuenta ha sido creada o
        reiniciada por un administrador con una contrasena provisional. En ese
        caso, la aplicacion consulta el perfil del usuario autenticado y comprueba
        el indicador must_change_password.

        Cuando dicho indicador esta activo:
        - Se informa al usuario de que el cambio de contrasena es obligatorio.
        - Se modifica el texto descriptivo de la pantalla.
        - Se oculta temporalmente el enlace de regreso al dashboard.
        - El usuario debe completar correctamente el cambio antes de continuar.

        La comunicacion con el backend se realiza mediante dos endpoints:
        - /api/auth/me, utilizado para consultar el perfil de la sesion actual.
        - /api/auth/change-password, utilizado para actualizar la contrasena.

        Las peticiones incluyen las credenciales de la sesion para que el backend
        pueda identificar al usuario autenticado.

        FLUJO GENERAL DE FUNCIONAMIENTO
        --------------------------------
        1. Al cargarse la pagina se consulta el perfil del usuario actual.
        2. Se comprueba si la contrasena tiene caracter provisional.
        3. Si el cambio es obligatorio, se adapta la interfaz y se impide volver
           al dashboard mediante el enlace mostrado en esta vista.
        4. El usuario introduce la contrasena actual y la nueva contrasena dos veces.
        5. El formulario envia los datos al backend mediante una peticion POST.
        6. Si la operacion finaliza correctamente, se limpia el formulario y se
           muestra un mensaje de confirmacion.
        7. Tras un breve intervalo, el navegador redirige al dashboard principal.
        8. Si se produce un error, se muestra el mensaje devuelto por el backend.

        La validacion definitiva de la contrasena actual, la coincidencia entre las
        nuevas claves y cualquier politica adicional de seguridad corresponde al
        backend, aunque el formulario incorpora restricciones HTML basicas.
        ============================================================================
    -->

    <!-- Define la codificacion de caracteres utilizada por el documento. -->
    <meta charset="UTF-8">

    <!-- Permite adaptar correctamente la interfaz a dispositivos moviles. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Titulo mostrado en la pestana del navegador. -->
    <title>S.M.I. CORE | Cambiar contrasena</title>

    <!--
        Se aplica el tema guardado antes de que el navegador represente la pagina.
        De esta forma se evita un cambio visual perceptible durante la carga.
        Si no existe una preferencia almacenada, se utiliza el tema oscuro.
    -->
    <script>
        document.documentElement.setAttribute(
            'data-theme',
            localStorage.getItem('smi-theme') || 'dark'
        );
    </script>

    <!--
        Se cargan las tipografias utilizadas por la interfaz.
        Inter se utiliza para textos generales y JetBrains Mono para etiquetas
        tecnicas o elementos relacionados con el sistema.
    -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">

    <!-- Hoja de estilos compartida por las distintas vistas de S.M.I. CORE. -->
    <link href="theme.css" rel="stylesheet">

    <style>
        /*
         * =========================================================================
         * VARIABLES GLOBALES DE ESTILO
         * =========================================================================
         *
         * Las variables CSS centralizan los colores principales utilizados en la
         * pantalla y facilitan mantener una apariencia coherente con el sistema.
         */
        :root {
            --bg-main: #0d1117;
            --panel-bg: #161b22;
            --border: #30363d;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
        }

        /*
         * box-sizing: border-box hace que padding y bordes formen parte de las
         * dimensiones totales calculadas para cada elemento.
         */
        * {
            box-sizing: border-box;
        }

        /*
         * =========================================================================
         * CONFIGURACION GENERAL DE LA PAGINA
         * =========================================================================
         *
         * CSS Grid permite centrar el formulario tanto horizontal como
         * verticalmente. El fondo utiliza degradados radiales para conservar la
         * estetica visual del resto de la aplicacion.
         */
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(88, 166, 255, 0.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(63, 185, 80, 0.08),
                    transparent 26%
                ),
                var(--bg-main);
        }

        /*
         * =========================================================================
         * CONTENEDOR PRINCIPAL
         * =========================================================================
         *
         * El formulario queda encapsulado en una tarjeta con una anchura maxima
         * controlada para conservar una lectura comoda en pantallas grandes.
         */
        .shell {
            width: min(100%, 520px);
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.34);
        }

        /*
         * Etiqueta tecnica situada sobre el titulo principal de la pantalla.
         */
        .eyebrow {
            display: inline-block;
            margin-bottom: 10px;
            color: var(--text-dim);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.1em;
        }

        /*
         * Titulo principal de la vista.
         */
        h1 {
            margin: 0 0 8px;
            font-size: 2rem;
            line-height: 1.05;
        }

        /*
         * Texto descriptivo situado bajo el titulo.
         * Su contenido puede modificarse mediante JavaScript si la contrasena es
         * provisional y el cambio resulta obligatorio.
         */
        .subtitle {
            margin: 0 0 22px;
            color: var(--text-dim);
            line-height: 1.6;
        }

        /*
         * =========================================================================
         * MENSAJES DE ESTADO
         * =========================================================================
         *
         * Los avisos permanecen ocultos por defecto y solamente se muestran cuando
         * JavaScript anade la clase "visible".
         */
        .notice {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        /*
         * La clase visible controla la aparicion del mensaje.
         */
        .notice.visible {
            display: block;
        }

        /*
         * Aviso informativo utilizado, entre otros casos, para indicar que existe
         * una contrasena provisional que debe ser sustituida.
         */
        .notice.info {
            border: 1px solid rgba(88, 166, 255, 0.28);
            background: rgba(88, 166, 255, 0.1);
            color: #b9dcff;
        }

        /*
         * Aviso mostrado cuando el backend rechaza la operacion o se produce un
         * error durante la peticion.
         */
        .notice.error {
            border: 1px solid rgba(248, 81, 73, 0.3);
            background: rgba(248, 81, 73, 0.08);
            color: #ffb0ac;
        }

        /*
         * Aviso mostrado cuando la nueva contrasena se almacena correctamente.
         */
        .notice.success {
            border: 1px solid rgba(63, 185, 80, 0.28);
            background: rgba(63, 185, 80, 0.08);
            color: #99e2a4;
        }

        /*
         * =========================================================================
         * FORMULARIO
         * =========================================================================
         *
         * Los campos se organizan verticalmente con una separacion uniforme.
         */
        form {
            display: grid;
            gap: 16px;
        }

        /*
         * Cada campo agrupa su etiqueta y su control de entrada.
         */
        .field {
            display: grid;
            gap: 8px;
        }

        /*
         * Etiquetas de los campos de contrasena.
         */
        .field label {
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /*
         * Boton principal encargado de enviar el formulario.
         */
        .btn-primary {
            width: 100%;
            min-height: 46px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, #5fa7ff 0%, #3a7de2 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(31, 102, 209, 0.24);
        }

        /*
         * Texto auxiliar que recuerda al usuario el alcance de esta pantalla.
         */
        .helper {
            margin-top: 16px;
            color: var(--text-dim);
            font-size: 12px;
            line-height: 1.6;
        }

        /*
         * Enlace de regreso al dashboard.
         *
         * JavaScript puede ocultarlo temporalmente si el usuario debe cambiar una
         * contrasena provisional antes de continuar utilizando la aplicacion.
         */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        /*
         * =========================================================================
         * DISENO RESPONSIVE
         * =========================================================================
         *
         * En pantallas pequenas se reduce el espacio interno y el tamano del titulo
         * para aprovechar mejor el espacio disponible.
         */
        @media (max-width: 560px) {
            .shell {
                padding: 22px 18px;
                border-radius: 18px;
            }

            h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>
    <!--
        ============================================================================
        CONTENIDO PRINCIPAL
        ============================================================================
        La pantalla contiene un unico formulario orientado a la gestion de la
        contrasena de la cuenta autenticada.
    -->
    <main class="shell">

        <!-- Identificador visual de la seccion de seguridad. -->
        <span class="eyebrow">S.M.I. CORE // SEGURIDAD DE CUENTA</span>

        <!-- Titulo principal de la operacion. -->
        <h1>Actualizar contrasena</h1>

        <!--
            El subtitulo puede cambiar dinamicamente cuando la cuenta utiliza una
            clave provisional y el cambio resulta obligatorio.
        -->
        <p class="subtitle" id="pageSubtitle">
            Cambia tu clave personal para seguir trabajando con normalidad dentro del sistema.
        </p>

        <!--
            CONTENEDORES DE NOTIFICACIONES
            Solamente uno de estos mensajes se muestra simultaneamente.
        -->
        <div id="infoNotice" class="notice info"></div>
        <div id="errorNotice" class="notice error"></div>
        <div id="successNotice" class="notice success"></div>

        <!--
            FORMULARIO DE CAMBIO DE CONTRASENA
            Los atributos required aplican una validacion basica en el navegador.
            minlength="6" exige una longitud minima antes de permitir el envio.
        -->
        <form id="passwordForm">

            <!-- Contrasena que utiliza actualmente la cuenta autenticada. -->
            <div class="field">
                <label for="currentPassword">Contrasena actual</label>
                <input
                    id="currentPassword"
                    class="input-custom"
                    type="password"
                    required>
            </div>

            <!-- Nueva clave que se desea establecer. -->
            <div class="field">
                <label for="newPassword">Nueva contrasena</label>
                <input
                    id="newPassword"
                    class="input-custom"
                    type="password"
                    minlength="6"
                    required>
            </div>

            <!--
                Confirmacion de la nueva clave.
                La comprobacion definitiva de coincidencia se realiza en el backend.
            -->
            <div class="field">
                <label for="confirmPassword">Confirmar nueva contrasena</label>
                <input
                    id="confirmPassword"
                    class="input-custom"
                    type="password"
                    minlength="6"
                    required>
            </div>

            <!-- El envio del formulario ejecuta la funcion submitPassword(). -->
            <button type="submit" class="btn-primary">
                Guardar nueva contrasena
            </button>
        </form>

        <!--
            Se informa de que esta pantalla no permite modificar otros atributos
            administrativos de la cuenta.
        -->
        <p class="helper">
            Solo puedes cambiar tu propia contrasena. El nombre de usuario y el rol siguen gestionados por administracion.
        </p>

        <!--
            El enlace se oculta cuando el cambio de una clave provisional es
            obligatorio y vuelve a mostrarse tras completar correctamente el proceso.
        -->
        <a href="index.html" class="back-link" id="backLink">
            Volver al dashboard
        </a>
    </main>


    <script>
        /*
         * ============================================================================
         * LOGICA DE CAMBIO DE CONTRASENA
         * ============================================================================
         *
         * Este bloque JavaScript controla:
         * - La consulta del perfil autenticado.
         * - La deteccion de una contrasena provisional.
         * - La presentacion de avisos informativos, errores y confirmaciones.
         * - El envio de la nueva contrasena al backend.
         * - La redireccion al dashboard despues de completar correctamente el cambio.
         * ============================================================================
         */

        /*
         * Determinacion de la URL base de la API.
         *
         * Si la pagina se ejecuta mediante HTTP o HTTPS se utiliza el mismo origen
         * desde el que se ha cargado la aplicacion. Si el archivo se ejecuta
         * directamente, se utiliza localhost:5000 como direccion de desarrollo.
         */
        const API_BASE = window.location.protocol.startsWith('http')
            ? window.location.origin
            : 'http://localhost:5000';


        /*
         * Se almacenan referencias a los elementos de la interfaz utilizados
         * repetidamente por las funciones posteriores.
         *
         * Esta practica evita realizar nuevas busquedas en el DOM cada vez que se
         * necesita actualizar un aviso, el subtitulo o el enlace de retorno.
         */
        const infoNotice = document.getElementById('infoNotice');
        const errorNotice = document.getElementById('errorNotice');
        const successNotice = document.getElementById('successNotice');
        const backLink = document.getElementById('backLink');
        const subtitle = document.getElementById('pageSubtitle');


        /**
         * Muestra un aviso concreto y oculta cualquier otro mensaje existente.
         *
         * La interfaz dispone de tres contenedores independientes para mensajes
         * informativos, errores y confirmaciones. Antes de mostrar un nuevo aviso,
         * la funcion limpia los tres para garantizar que solamente exista un
         * mensaje visible simultaneamente.
         *
         * @param {HTMLElement} node Elemento que debe mostrar el mensaje.
         * @param {string} message Texto que se desea presentar al usuario.
         * @returns {void}
         */
        function showNotice(node, message) {
            /*
             * Se recorren los tres tipos de aviso para eliminar su estado visible y
             * cualquier contenido anterior.
             */
            [infoNotice, errorNotice, successNotice].forEach(item => {
                item.classList.remove('visible');
                item.textContent = '';
            });

            /*
             * Si no se recibe ningun mensaje, la funcion finaliza despues de haber
             * limpiado los avisos existentes.
             */
            if (!message) return;

            /*
             * textContent inserta el contenido como texto y evita que el mensaje
             * sea interpretado como HTML.
             */
            node.textContent = message;

            /*
             * La clase visible modifica la regla CSS display y hace aparecer el
             * aviso seleccionado.
             */
            node.classList.add('visible');
        }


        /**
         * Consulta el perfil de la cuenta autenticada y comprueba si la contrasena
         * actual tiene caracter provisional.
         *
         * Cuando must_change_password es verdadero, la pantalla informa de que el
         * cambio es obligatorio y oculta el enlace de regreso al dashboard para
         * guiar al usuario hacia la actualizacion de la clave.
         *
         * @returns {Promise<void>}
         */
        async function loadProfile() {
            try {
                /*
                 * Se solicita el perfil asociado a la sesion actual.
                 *
                 * credentials: 'same-origin' indica al navegador que debe incluir
                 * las credenciales de la sesion cuando la peticion se dirige al
                 * mismo origen que la aplicacion.
                 */
                const response = await fetch(
                    `${API_BASE}/api/auth/me`,
                    {
                        credentials: 'same-origin'
                    }
                );

                /*
                 * Si el servidor responde con un codigo HTTP no satisfactorio, no
                 * se intenta procesar el contenido y se mantiene la vista normal.
                 */
                if (!response.ok) return;

                /*
                 * El cuerpo JSON de la respuesta se convierte en un objeto
                 * JavaScript con la informacion del usuario autenticado.
                 */
                const profile = await response.json();

                /*
                 * must_change_password indica que la clave actual fue asignada como
                 * provisional y debe sustituirse antes de continuar trabajando.
                 */
                if (profile.must_change_password) {
                    /*
                     * Se modifica el texto principal para explicar que el cambio no
                     * es opcional en este caso.
                     */
                    subtitle.textContent =
                        'Tu cuenta tiene una contrasena provisional. Debes cambiarla antes de acceder al resto de modulos.';

                    /*
                     * Se utiliza el aviso informativo para explicar el motivo del
                     * cambio obligatorio.
                     */
                    showNotice(
                        infoNotice,
                        'Cambio obligatorio: esta cuenta fue creada o reiniciada por administracion con una clave provisional.'
                    );

                    /*
                     * El enlace de regreso se oculta para evitar que la propia
                     * interfaz ofrezca una salida directa mientras persista la clave
                     * provisional.
                     */
                    backLink.style.display = 'none';
                }
            } catch (error) {
                /*
                 * Un fallo al consultar el perfil no bloquea el formulario.
                 * El error se registra en consola para facilitar la depuracion.
                 */
                console.warn(
                    'No se pudo cargar el perfil actual',
                    error
                );
            }
        }


        /**
         * Procesa el formulario y solicita al backend la actualizacion de la clave.
         *
         * La funcion recoge la contrasena actual, la nueva contrasena y su
         * confirmacion, construye un objeto JSON y lo envia al endpoint de cambio
         * de contrasena mediante una peticion POST.
         *
         * Si la operacion finaliza correctamente:
         * - Se limpia el formulario.
         * - Se muestra un mensaje de confirmacion.
         * - Se vuelve a mostrar el enlace al dashboard.
         * - Se redirige automaticamente a la pagina principal.
         *
         * Si el backend rechaza la peticion, el mensaje de error recibido se muestra
         * en la interfaz.
         *
         * @param {SubmitEvent} event Evento generado al enviar el formulario.
         * @returns {Promise<void>}
         */
        async function submitPassword(event) {
            /*
             * preventDefault() evita el envio tradicional del formulario y la
             * recarga completa de la pagina.
             */
            event.preventDefault();

            /*
             * Se construye el objeto que se enviara al backend.
             *
             * Los nombres de sus propiedades coinciden con los campos esperados por
             * el endpoint de cambio de contrasena.
             */
            const payload = {
                current_password:
                    document.getElementById('currentPassword').value,

                new_password:
                    document.getElementById('newPassword').value,

                confirm_password:
                    document.getElementById('confirmPassword').value,
            };

            try {
                /*
                 * La nueva informacion se envia mediante POST al endpoint destinado
                 * a actualizar la contrasena de la cuenta autenticada.
                 */
                const response = await fetch(
                    `${API_BASE}/api/auth/change-password`,
                    {
                        method: 'POST',

                        /*
                         * Se informa al servidor de que el cuerpo de la peticion se
                         * encuentra codificado en formato JSON.
                         */
                        headers: {
                            'Content-Type': 'application/json'
                        },

                        /*
                         * Las credenciales de la sesion se incluyen para que el
                         * backend pueda identificar a la cuenta que realiza el cambio.
                         */
                        credentials: 'same-origin',

                        /*
                         * JSON.stringify() transforma el objeto JavaScript en una
                         * cadena JSON apta para enviarse en el cuerpo HTTP.
                         */
                        body: JSON.stringify(payload),
                    }
                );

                /*
                 * Se procesa el cuerpo antes de comprobar response.ok para poder
                 * recuperar, en caso de error, el mensaje proporcionado por el
                 * backend.
                 */
                const result = await response.json();

                /*
                 * Si el servidor devuelve una respuesta no satisfactoria se genera
                 * una excepcion. Se prioriza el mensaje recibido desde el backend.
                 */
                if (!response.ok) {
                    throw new Error(
                        result.error ||
                        'No se pudo actualizar la contrasena'
                    );
                }

                /*
                 * Tras una actualizacion correcta se vacian los campos de entrada,
                 * evitando conservar la contrasena escrita en el formulario.
                 */
                document
                    .getElementById('passwordForm')
                    .reset();

                /*
                 * Se informa al usuario de que el proceso ha finalizado
                 * correctamente.
                 */
                showNotice(
                    successNotice,
                    'Contrasena actualizada correctamente. Ya puedes continuar con normalidad.'
                );

                /*
                 * El enlace al dashboard vuelve a estar disponible, incluso si
                 * anteriormente se habia ocultado por tratarse de una clave
                 * provisional.
                 */
                backLink.style.display = 'inline-flex';

                /*
                 * setTimeout() retrasa ligeramente la redireccion para que el usuario
                 * pueda visualizar el mensaje de confirmacion antes de abandonar la
                 * pantalla.
                 */
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);

            } catch (error) {
                /*
                 * Los errores devueltos por el servidor o producidos durante la
                 * peticion se muestran utilizando el contenedor visual de error.
                 */
                showNotice(
                    errorNotice,
                    error.message ||
                    'No se pudo actualizar la contrasena.'
                );
            }
        }


        /*
         * ============================================================================
         * REGISTRO DE EVENTOS E INICIALIZACION
         * ============================================================================
         */

        /*
         * El evento submit del formulario se delega en submitPassword(), que
         * gestiona el envio mediante JavaScript.
         */
        document
            .getElementById('passwordForm')
            .addEventListener(
                'submit',
                submitPassword
            );

        /*
         * La consulta del perfil se realiza al cargar la vista para determinar desde
         * el primer momento si el cambio de contrasena es obligatorio.
         */
        loadProfile();
    </script>
</body>
</html>
